# Local dev/testing only. `postgres` is what this app needs to run for real
# (migrate, seed, e2e tests that actually query data). Prefer `pnpm dev`
# against this Postgres instead of rebuilding the image on every change.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: solid_backend
    ports:
      - '5432:5432'
    volumes:
      - solid_backend_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ['full']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/solid_backend?schema=public
      CORS_ORIGIN: http://localhost:5173
      JWT_ACCESS_SECRET: dev-only-access-secret-change-me
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: dev-only-refresh-secret-change-me
      JWT_REFRESH_EXPIRES_IN: 7d
    ports:
      - '3000:3000'

volumes:
  solid_backend_postgres_data:
