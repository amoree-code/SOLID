# Local dev/testing only.
#   docker compose up -d postgres        just the database (what `pnpm quickstart` starts)
#   docker compose --profile full up     database + migrations + the API, nothing else needed
# POSTGRES_PORT (default 5432) and API_PORT (default 3000) move the host ports if taken.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: solid_backend
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - solid_backend_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies pending migrations once, then exits; the API waits for it to succeed.
  migrate:
    build:
      context: .
      target: migrate
    profiles: ['full']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/solid_backend?schema=public

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ['full']
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/solid_backend?schema=public
      CORS_ORIGIN: http://localhost:5173
    ports:
      - '${API_PORT:-3000}:3000'
    # Healthy only once Nest is actually serving (busybox wget ships with node:alpine).
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  solid_backend_postgres_data:
